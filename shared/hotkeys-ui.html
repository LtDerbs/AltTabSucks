<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AltTabSucks — Hotkeys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /*
    Shared settings UI for AltTabSucks hotkey bindings — served by the local bridge server at
    GET /hotkeys-ui (see alttabsucks_server.py). "Shared" as in: this same file is meant to work
    unmodified whether it's served by the Linux Python server or (eventually) a Windows
    PowerShell one — see alttabsucks_linux_porting_checklist.md for that follow-up. Everything
    here talks to the server it was served *from* (relative fetch() URLs — same-origin, no CORS
    config needed), never a hardcoded host/port.

    Data model: this page is the source of truth once you save from it — GET /hotkeys-config
    loads the current linux/kwin/alttabsucks/contents/code/hotkeys.json, POST regenerates
    hotkeys.js from whatever you save here. Hand-editing hotkeys.js directly still works if you
    never open this page, but once you save here, hand edits to hotkeys.js will be overwritten by
    the next save (see hotkeys_generator.py's module docstring).
  */
  :root {
    --bg: #0b0e14; --panel: #131722; --border: #232838;
    --text: #e6e9ef; --text-dim: #8b92a5; --accent: #5b9cff;
    --ok: #4cd97b; --err: #ff5b5b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --border: #e2e5eb;
      --text: #1c1f27; --text-dim: #6b7280; --accent: #2563eb;
      --ok: #1a9d54; --err: #d92626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 24px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1500px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .token-row { display: flex; gap: 8px; flex: 0 0 auto; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  input[type=text], select {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; font-size: 13px;
  }
  /* Same specificity as input[type=text] above (class+tag either way) — declared after it so
     this wins the cascade and the token input doesn't stretch to fill the header row. */
  .token-row input { width: 220px; }
  /* The key-sequence field is the only readonly input on the page — it's a hotkey recorder,
     not free text (see recordKeyField()), so it gets a distinct affordance. */
  input[readonly] { cursor: pointer; }
  input[readonly]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .row > div { flex: 1 1 200px; }
  button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  /* One section per binding type (see TYPE_COLUMNS/renderGroup) — a single header row of column
     labels shared by every binding of that type, instead of every single row repeating its own
     label-above-input for every field. That repetition was the biggest cost in the old layout:
     each field was a label line plus an input line, for every row, every time — with more than
     a handful of hotkeys of the same type it dwarfed the actual data on screen. */
  .group { margin-bottom: 20px; }
  .group-title {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-dim); padding: 0 4px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border);
  }
  .group-add-btn { font-size: 11px; font-weight: 600; padding: 3px 9px; text-transform: none; letter-spacing: normal; }
  .group-header { display: flex; gap: 6px 10px; flex-wrap: wrap; padding: 0 4px; margin-bottom: 2px; }
  .group-header label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  /* Each binding is one flex-wrapping row rather than a stacked card: on a wide window a
     whole hotkey fits on a single line, and as the window narrows fields wrap onto extra
     lines (still grouped under the same binding, still readable) purely via flex-wrap — no
     JS resize handling needed. Rows are bare inputs now (no per-row labels — see the group
     header above), so they're one line tall instead of two. */
  .binding { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 5px 4px; border-bottom: 1px solid var(--border); }
  .group .binding:last-child { border-bottom: none; }
  .field { display: flex; flex-direction: column; gap: 3px; flex: 1 1 110px; min-width: 90px; }
  .field label { font-size: 10px; margin-bottom: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field.grow { flex: 2 1 170px; }
  /* .field's min-width: 90px was meant for real labeled inputs — left un-reset here, the
     icon-only fixed remove field was silently padded out to 90px minimum even though its
     content is a few px wide, wasting real width and contributing to it wrapping onto its own
     line on wider rows (tabFocus: 9 fields wide). */
  .field.fixed { flex: 0 0 auto; min-width: 0; }
  .field.fixed select, .field.fixed input { width: auto; }
  /* Fixed pixel widths (not content-sized, unlike plain .field.fixed above) so a group-header
     placeholder/label cell lines up with its data-row counterpart even though the data-row
     one's actual content (drag handle glyph / badge text / a <select>'s own rendered width)
     doesn't have a natural width of its own to match against. Previously this relied on a
     descendant selector (.field.fixed select { min-width: 160px }) instead of a shared class —
     that broke the header specifically, since a header cell holding just a <label> has no
     <select> for the descendant selector to ever match, so it never got the width the row's
     <select> did. Every column below is given the *same* class on *both* sides (see
     renderGroupHeader/renderBindingRow/TYPE_COLUMNS) specifically so this can't happen again.
     Written as .field.spacer-X (two classes, matching .field.fixed's own specificity) rather
     than a bare .spacer-X — every real usage is already "field fixed spacer-X" together (see
     field()'s callers), so a bare .spacer-X has the *same* specificity as plain .field but
     *less* than .field.fixed, and .field.fixed's flex: 0 0 auto silently won regardless of
     which rule came later in the file — confirmed live as a real bug (the header's "Type"
     placeholder rendered at its bare label's content width, not 160px, before this fix). */
  .field.spacer-badge { flex: 0 0 34px; }
  .field.select-col { flex: 0 0 160px; } /* any per-type Profile column (a <select>, like Type used to be) */
  .field.spacer-remove { flex: 0 0 34px; }
  /* Not wrapped in .field at all (see the drag handle's own render calls), so no .field.fixed
     to out-specify — a bare selector is fine here. */
  .spacer-handle { flex: 0 0 20px; }
  .badge-box { padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); font-size: 12px; font-weight: 600; color: var(--text-dim); text-align: center; }
  .badge-box:hover { border-color: var(--accent); color: var(--text); }
  /* Dims the whole row (badge included) rather than exempting the badge from the dimming —
     simpler than carving out a CSS exception, and the badge stays just as clickable at reduced
     opacity (opacity doesn't affect pointer-events) so re-enabling is no harder to hit. */
  .binding.disabled { opacity: 0.5; }
  .remove-btn { padding: 6px 10px; font-size: 12px; }
  /* No longer pinned to a card corner (there's no card now, just a bottom-border divider row)
     — it's an ordinary leading cell in the row's own flex flow, same as the badge next to it. */
  .drag-handle { font-size: 11px; line-height: 1; color: var(--text-dim); cursor: grab; user-select: none; text-align: center; }
  .drag-handle:hover { color: var(--text); }
  .drag-handle:active { cursor: grabbing; }
  .binding.dragging { opacity: 0.4; }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  /* The resourceClass typeahead's suggestion box — plain page content (position: fixed,
     positioned in JS from the input's own getBoundingClientRect), not a native popup surface
     like <datalist>/<select>, specifically because those silently fail to paint at all on this
     platform (confirmed Chromium/Wayland bug — see showSuggestionsFor's comment). */
  .suggestions {
    position: fixed; z-index: 1000; display: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    max-height: 220px; overflow-y: auto; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  .suggestion-item { padding: 6px 9px; font-size: 13px; cursor: pointer; }
  .suggestion-item:hover, .suggestion-item.active { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>AltTabSucks — Hotkeys</h1>
      <div class="sub">Saving regenerates <code>hotkeys.js</code> and deploys it to the running KWin script automatically.</div>
    </div>
    <div class="token-row">
      <input type="text" id="token" placeholder="auth token (Server/token.txt)">
      <button id="reload" type="button">Reload</button>
    </div>
  </div>

  <div id="bindings"></div>
  <!-- The resourceClass typeahead's suggestion box (see showSuggestionsFor) is created and
       appended to <body> on first use — nothing static needed here. -->

  <div class="toolbar">
    <button id="add">+ Add hotkey</button>
    <button id="save" class="primary">Save</button>
    <span id="status" class="status"></span>
  </div>
</div>

<script>
const TYPE_LABELS = {
  windowCycle: "Cycle app windows",
  windowToggle: "Toggle app windows",
  profileCycle: "Cycle browser profile",
  tabFocus: "Focus browser tab",
  splitTab: "Split browser tab into new window",
  mergeTabs: "Merge browser windows",
  runCommand: "Run command",
};

let profiles = [];
let runningResourceClasses = [];
let bindings = [];
let draggedIndex = null; // set by a drag-handle's dragstart, read by another binding's drop

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  for (const c of (children || [])) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return e;
}

function authHeaders() {
  return { "X-AltTabSucks-Token": actualToken };
}

// The token input displays a masked value (first 8 chars, then a dot per remaining char) so
// the full secret isn't sitting on screen for a screenshot/share to catch — but the real
// value has to live somewhere other than the input's own .value, since that's what's on
// display. actualToken is that real value; the input unmasks to it on focus (so it's still
// editable/selectable/copyable) and re-masks on blur.
let actualToken = "";

function maskToken(v) {
  return v.length <= 8 ? v : v.slice(0, 8) + "•".repeat(v.length - 8);
}

async function apiGet(path) {
  const res = await fetch(path, { headers: authHeaders() });
  if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  return res.json();
}

function setStatus(msg, isError) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + (isError ? "err" : "ok");
}

function profileOptions(selected) {
  const opts = profiles.map(p => el("option", p === selected ? { value: p, selected: "" } : { value: p }, [p]));
  if (selected && !profiles.includes(selected)) {
    opts.unshift(el("option", { value: selected, selected: "" }, [selected + " (not in discovered list)"]));
  }
  return opts;
}

// Hand-rolled typeahead dropdown — NOT a native <input list=...>/<datalist> pair, which was the
// first thing tried here and looked completely correct end to end (server data verified fresh
// live, and a headless DOM replay of the exact bytes the browser receives populated the
// <datalist> with real <option>s and never threw) but still showed nothing on screen. Root
// cause: a confirmed Chromium/Wayland bug where native popup-style widgets (datalist suggestions,
// <select> dropdowns) silently fail to paint at all on this platform combination — nothing this
// page's own HTML/JS could fix, so a suggestion list rendered as plain page content (an ordinary
// positioned <div>, not a native popup surface) sidesteps it entirely.
//
// One shared floating box, repositioned/repopulated for whichever resourceClass input currently
// has focus, rather than one per row — mirrors why the toast daemon is one persistent surface
// instead of one per call.
let suggestionsBox = null;
let suggestionsForInput = null; // the <input> the box is currently showing matches for, or null

function hideSuggestions() {
  if (suggestionsBox) suggestionsBox.style.display = "none";
  suggestionsForInput = null;
}

// Commits a chosen value the same way a real keystroke would — dispatching a synthetic "input"
// event re-runs textInput's own listener (binding[key] = input.value) rather than duplicating
// that assignment here, so there's exactly one place that ever writes to the binding from this
// field.
function selectSuggestion(input, value) {
  input.value = value;
  input.dispatchEvent(new Event("input", { bubbles: true }));
  hideSuggestions();
  input.focus();
}

function showSuggestionsFor(input) {
  const q = input.value.trim().toLowerCase();
  const matches = runningResourceClasses.filter(rc => !q || rc.toLowerCase().includes(q));
  if (matches.length === 0) { hideSuggestions(); return; }
  if (!suggestionsBox) {
    suggestionsBox = el("div", { class: "suggestions" });
    document.body.appendChild(suggestionsBox);
  }
  suggestionsBox.innerHTML = "";
  matches.forEach((rc, i) => {
    const item = el("div", { class: "suggestion-item" + (i === 0 ? " active" : "") }, [rc]);
    // mousedown, not click: fires (and with preventDefault, keeps focus on the input) before a
    // click would, so there's no blur-vs-click ordering race to work around.
    item.addEventListener("mousedown", (e) => { e.preventDefault(); selectSuggestion(input, rc); });
    suggestionsBox.appendChild(item);
  });
  const rect = input.getBoundingClientRect();
  suggestionsBox.style.left = rect.left + "px";
  suggestionsBox.style.top = rect.bottom + "px";
  suggestionsBox.style.width = rect.width + "px";
  suggestionsBox.style.display = "block";
  suggestionsForInput = input;
}

// Arrow-key/Enter navigation, wired from textInput below onto just the resourceClass fields.
// Kept separate from showSuggestionsFor's own mousedown handling since keyboard and mouse
// selection don't share a natural event to hook — this just moves which item has .active and
// lets Enter commit whichever one that is.
function handleSuggestionKeydown(e, input) {
  if (e.key === "Escape") { hideSuggestions(); return; }
  if (!suggestionsBox || suggestionsBox.style.display === "none" || suggestionsForInput !== input) return;
  const items = Array.from(suggestionsBox.children);
  if (items.length === 0) return;
  const idx = items.findIndex(i => i.classList.contains("active"));
  if (e.key === "ArrowDown") {
    e.preventDefault();
    items[idx]?.classList.remove("active");
    items[(idx + 1) % items.length].classList.add("active");
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    items[idx]?.classList.remove("active");
    items[(idx - 1 + items.length) % items.length].classList.add("active");
  } else if (e.key === "Enter" && idx !== -1) {
    e.preventDefault();
    selectSuggestion(input, items[idx].textContent);
  }
}

// Qt key-sequence names for keys whose KeyboardEvent.key doesn't already match (registerShortcut
// takes a Qt-style string like "Ctrl+Alt+Shift+B" — see main.js's header comment). Letters,
// digits, and F1-F12 need no lookup; anything not listed here falls back to e.key as-is, which
// covers most punctuation keys correctly (Qt accepts ",", ".", "/", etc. verbatim).
const QT_KEY_NAMES = {
  " ": "Space", "Escape": "Escape", "Enter": "Return", "Tab": "Tab",
  "Backspace": "Backspace", "Delete": "Delete", "Insert": "Insert",
  "Home": "Home", "End": "End", "PageUp": "PageUp", "PageDown": "PageDown",
  "ArrowUp": "Up", "ArrowDown": "Down", "ArrowLeft": "Left", "ArrowRight": "Right",
};
const MODIFIER_KEYS = new Set(["Control", "Alt", "Shift", "Meta"]);

function qtKeyName(key) {
  if (/^[a-zA-Z]$/.test(key)) return key.toUpperCase();
  return QT_KEY_NAMES[key] || key;
}

function heldModifiers(e) {
  const mods = [];
  if (e.ctrlKey) mods.push("Ctrl");
  if (e.altKey) mods.push("Alt");
  if (e.shiftKey) mods.push("Shift");
  if (e.metaKey) mods.push("Meta");
  return mods;
}

// Turns a plain text input into a hotkey recorder: click in, hold modifiers, press a key —
// no more hand-typing "Ctrl+Alt+Shift+B" and getting the casing/plus-signs wrong. readOnly
// blocks normal character insertion (there's nothing to type; the field only reflects what
// the keyboard is actually doing) while still receiving focus and key events like any input.
function recordKeyField(input, binding) {
  input.readOnly = true;
  input.placeholder = "click, then press keys";

  input.addEventListener("keydown", (e) => {
    e.preventDefault();
    if (e.key === "Escape" && heldModifiers(e).length === 0) {
      // Bare Escape cancels/clears rather than being recorded as the key itself — otherwise
      // there'd be no way to back out of a recording without also overwriting the binding.
      binding.key = "";
      input.value = "";
      input.blur();
      return;
    }
    if (MODIFIER_KEYS.has(e.key)) {
      // Still just holding modifiers — show a live "Ctrl+Alt+…" preview so the user can see
      // what's being held before committing to a final key.
      input.value = heldModifiers(e).join("+") + "+";
      return;
    }
    binding.key = heldModifiers(e).concat(qtKeyName(e.key)).join("+");
    input.value = binding.key;
  });

  // Releasing a modifier before pressing a real key (e.g. tapped Ctrl, let go) would otherwise
  // leave the live "Ctrl+" preview stuck on screen — revert to the last saved value once no
  // modifiers are held.
  input.addEventListener("keyup", (e) => {
    if (MODIFIER_KEYS.has(e.key) && heldModifiers(e).length === 0) {
      input.value = binding.key || "";
    }
  });

  input.addEventListener("blur", () => { input.value = binding.key || ""; });
}

function field(labelText, inputEl, extraClass) {
  const wrap = el("div", { class: "field" + (extraClass ? " " + extraClass : "") });
  // labelText is null for a data-row cell (its label lives once in the group header instead —
  // see renderGroupHeader) and inputEl is null for a header cell (labels only, no input to show).
  if (labelText != null) wrap.appendChild(el("label", {}, [labelText]));
  if (inputEl != null) wrap.appendChild(inputEl);
  return wrap;
}

function textInput(binding, key, placeholder, suggest) {
  const attrs = { type: "text", placeholder: placeholder || "" };
  if (suggest) attrs.autocomplete = "off"; // this field has its own typeahead — don't layer the browser's on top
  const input = el("input", attrs);
  input.value = binding[key] || "";
  input.addEventListener("input", () => {
    binding[key] = input.value;
    if (suggest) showSuggestionsFor(input);
  });
  if (suggest) {
    input.addEventListener("focus", () => showSuggestionsFor(input));
    // A short delay, not an immediate hide: a suggestion click is a mousedown+mouseup pair that
    // straddles this blur, and hiding synchronously would tear the box down mid-click before
    // its own mousedown handler (which runs first and calls preventDefault, per
    // showSuggestionsFor) ever got a chance to matter — kept anyway as a defensive margin.
    input.addEventListener("blur", () => { setTimeout(hideSuggestions, 150); });
    input.addEventListener("keydown", (e) => handleSuggestionKeydown(e, input));
  }
  return input;
}

// Shared by every TYPE_COLUMNS entry that has a resourceClass field, instead of repeating the
// same textInput(...) call per type — the trailing `true` turns on the typeahead dropdown (see
// showSuggestionsFor above), sourced from runningResourceClasses (populated in load() from GET
// /running-resource-classes; main.js pushes that list periodically — see its own comment for
// why the push happens that direction, not a pull from here).
function resourceClassColumn() {
  return { label: "resourceClass", extraClass: "grow",
    build: (b) => textInput(b, "resourceClass", "brave-browser, org.kde.dolphin, ...", true) };
}

function listInput(binding, key, placeholder) {
  const input = el("input", { type: "text", placeholder: placeholder || "one per line, or comma-separated" });
  input.value = (binding[key] || []).join(", ");
  input.addEventListener("input", () => {
    binding[key] = input.value.split(",").map(s => s.trim()).filter(Boolean);
  });
  return input;
}

function profileSelect(binding) {
  const select = el("select", {}, profileOptions(binding.profileName));
  // A <select> with no option explicitly marked selected still shows its first option
  // selected (plain browser default rendering) — that's what was happening whenever
  // binding.profileName was empty: "Personal" *looked* chosen, but binding.profileName was
  // never actually set to it (no "change" event fires just from that default rendering), so
  // save sent an empty profileName and the server correctly rejected it. Sync state to
  // match what's on screen right away instead of waiting for a change event that may never
  // come if the first option happens to already be the one the user wants.
  if (!binding.profileName && select.options.length) {
    binding.profileName = select.options[select.selectedIndex].value;
  }
  select.addEventListener("change", () => { binding.profileName = select.value; });
  return select;
}

function keyInput(binding) {
  const input = el("input", { type: "text" });
  input.value = binding.key || "";
  recordKeyField(input, binding);
  return input;
}

// Column spec per binding type — one entry per data field that type actually uses, in display
// order. The single source of truth for both the group header (labels only, built once per
// type) and every data row of that type (inputs only, no per-row label) — see field() above.
// Getting a type's header and its rows out of sync isn't possible since both read this same list.
const TYPE_COLUMNS = {
  windowCycle: [
    { label: "Title", extraClass: null, build: (b) => textInput(b, "title", "Cycle Browser") },
    { label: "Key sequence", extraClass: null, build: (b) => keyInput(b) },
    resourceClassColumn(),
    { label: "Launch command (optional — spawned if no window open)", extraClass: "grow", build: (b) => listInput(b, "launchArgv", "e.g. dolphin") },
  ],
  profileCycle: [
    { label: "Title", extraClass: null, build: (b) => textInput(b, "title", "Cycle Browser") },
    { label: "Key sequence", extraClass: null, build: (b) => keyInput(b) },
    resourceClassColumn(),
    { label: "Profile", extraClass: "fixed select-col", build: (b) => profileSelect(b) },
  ],
  tabFocus: [
    { label: "Title", extraClass: null, build: (b) => textInput(b, "title", "Cycle Browser") },
    { label: "Key sequence", extraClass: null, build: (b) => keyInput(b) },
    resourceClassColumn(),
    { label: "Profile", extraClass: "fixed select-col", build: (b) => profileSelect(b) },
    { label: "URL pattern(s)", extraClass: "grow", build: (b) => listInput(b, "urlPatterns", "mail.google.com") },
    { label: "Open URL (if no match)", extraClass: "grow", build: (b) => textInput(b, "openUrl", "https://mail.google.com") },
  ],
  runCommand: [
    { label: "Title", extraClass: null, build: (b) => textInput(b, "title", "Cycle Browser") },
    { label: "Key sequence", extraClass: null, build: (b) => keyInput(b) },
    { label: "Command (argv, no shell — one arg per line/comma)", extraClass: "grow", build: (b) => listInput(b, "argv", "/path/to/installer.sh, reload-hotkeys") },
  ],
};
// windowToggle behaves exactly like windowCycle field-wise, and splitTab/mergeTabs share
// profileCycle's exact fields (Title/Key/resourceClass/Profile, no window/launch/URL fields of
// their own) — reusing the spec rather than repeating it keeps them impossible to drift apart.
TYPE_COLUMNS.windowToggle = TYPE_COLUMNS.windowCycle;
TYPE_COLUMNS.splitTab = TYPE_COLUMNS.profileCycle;
TYPE_COLUMNS.mergeTabs = TYPE_COLUMNS.profileCycle;

function newBindingOfType(type) {
  const b = { type, title: "", key: "", enabled: true };
  // runCommand has no window/tab/profile to match against — matches the field-list special
  // case below, which hides resourceClass entirely for it rather than showing it unused.
  if (type !== "runCommand") b.resourceClass = "";
  return b;
}

function renderBindingRow(binding, localIndex) {
  const index = bindings.indexOf(binding); // real position in `bindings` — what save/drag/remove all key off
  const row = el("div", { class: "binding" + (binding.enabled === false ? " disabled" : "") });

  const badgeBox = el("button", {
    type: "button", class: "badge-box",
    title: binding.enabled === false ? "Disabled — click to enable" : "Click to disable",
  }, [`#${localIndex + 1}`]);
  badgeBox.addEventListener("click", () => {
    binding.enabled = binding.enabled === false; // false -> true, true/undefined -> false
    renderAll();
  });

  // Native HTML5 drag-and-drop, restricted to this one small handle rather than the whole row
  // (draggable="true" on the row would turn ordinary text selection inside its inputs into an
  // accidental drag). dragover/drop still listen on the *row* below, not the handle — the user
  // drops wherever the mouse ends up, not necessarily on another handle. Reordering only makes
  // sense within the same type group — a binding's type isn't changeable in place at all (see
  // the group's own +Add for creating one of a different type), so dragging onto a different
  // type's row would just silently do nothing visible; guarded out here instead of leaving that
  // dead end for the user to find.
  const dragHandle = el("div", { class: "drag-handle spacer-handle", draggable: "true", title: "Drag to reorder within this group" }, ["⋮⋮"]);
  dragHandle.addEventListener("dragstart", (e) => {
    draggedIndex = index;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(index)); // Firefox requires setData to actually start a drag
    row.classList.add("dragging");
  });
  dragHandle.addEventListener("dragend", () => {
    draggedIndex = null;
    row.classList.remove("dragging");
  });
  row.addEventListener("dragover", (e) => {
    if (draggedIndex === null || bindings[draggedIndex].type !== binding.type) return;
    e.preventDefault(); // required for drop to fire at all
    e.dataTransfer.dropEffect = "move";
  });
  row.addEventListener("drop", (e) => {
    if (draggedIndex === null || bindings[draggedIndex].type !== binding.type) return;
    e.preventDefault(); // even for a same-row no-op drop below — otherwise the browser's
                         // default handling of the dragstart's text/plain payload can kick in
    if (draggedIndex === index) return;
    const [moved] = bindings.splice(draggedIndex, 1);
    bindings.splice(index, 0, moved);
    draggedIndex = null;
    renderAll();
  });

  const removeBtn = el("button", { class: "danger remove-btn", type: "button", title: "Remove this hotkey" }, ["✕"]);
  removeBtn.addEventListener("click", () => { bindings.splice(index, 1); renderAll(); });

  row.appendChild(dragHandle);
  // spacer-badge goes on the *wrapper* here, not the button itself — a fixed-width flex class
  // means something different depending on which flex container it's in (main-axis is
  // horizontal in .binding/.group-header, but vertical inside .field's own column layout), so
  // putting a width class straight on a leaf control instead of its wrapper can silently set
  // its *height* instead — confirmed live as a real bug (originally hit via the Type <select>
  // this row used to have) before this fix.
  row.appendChild(field(null, badgeBox, "fixed spacer-badge"));
  (TYPE_COLUMNS[binding.type] || []).forEach((col) => {
    row.appendChild(field(null, col.build(binding), col.extraClass));
  });
  row.appendChild(field(null, removeBtn, "fixed spacer-remove"));
  return row;
}

// One header row per type, shared by every binding of that type below it — see the .group-header
// CSS comment. Builds the same leading placeholder cell (handle/badge) a data row builds, then
// one labeled cell per TYPE_COLUMNS entry, then the same trailing placeholder cell a data row's
// ✕ button takes up — needed for more than just visual completeness: flexbox splits a row's
// *leftover* width (after every item's own basis) among the "grow" columns (resourceClass,
// urlPatterns, ...) proportionally, so leaving the header short of the row's trailing button
// width would hand the header's grow columns more leftover space than the row's own get,
// throwing off exactly the columns most worth keeping aligned. Confirmed live: before this,
// every grow column in the header sat visibly wider than its input below it.
function renderGroupHeader(type) {
  const header = el("div", { class: "group-header" });
  header.appendChild(el("div", { class: "spacer-handle" }));
  header.appendChild(field(null, null, "fixed spacer-badge"));
  (TYPE_COLUMNS[type] || []).forEach((col) => {
    header.appendChild(field(col.label, null, col.extraClass));
  });
  header.appendChild(field(null, null, "fixed spacer-remove"));
  return header;
}

function renderGroup(type, groupBindings) {
  const section = el("div", { class: "group" });

  const titleRow = el("div", { class: "group-title" });
  titleRow.appendChild(el("span", {}, [TYPE_LABELS[type]]));
  const addBtn = el("button", { type: "button", class: "group-add-btn", title: `Add a "${TYPE_LABELS[type]}" hotkey` }, ["+ Add"]);
  addBtn.addEventListener("click", () => { bindings.push(newBindingOfType(type)); renderAll(); });
  titleRow.appendChild(addBtn);
  section.appendChild(titleRow);

  section.appendChild(renderGroupHeader(type));
  groupBindings.forEach((b, i) => section.appendChild(renderBindingRow(b, i)));
  return section;
}

function renderAll() {
  const container = document.getElementById("bindings");
  container.innerHTML = "";
  // Fixed type order (TYPE_LABELS', not `bindings`') so groups don't reshuffle position just
  // because of what order bindings happen to be saved in. Every type gets a section
  // unconditionally, even with zero bindings — the previous "skip an empty type's section
  // entirely" behavior saved a little vertical space but was a real dead end once the Type
  // <select> was removed (see the group's own +Add above): deleting a section's last binding
  // took its whole section, +Add button included, with it, leaving no way back to that type
  // short of hand-editing hotkeys.json. Reported live: deleting the sole "Run command" binding
  // made the entire Run Command section vanish.
  Object.keys(TYPE_LABELS).forEach((type) => {
    const groupBindings = bindings.filter((b) => b.type === type);
    container.appendChild(renderGroup(type, groupBindings));
  });
}

document.getElementById("add").addEventListener("click", () => {
  bindings.push(newBindingOfType("windowCycle"));
  renderAll();
});

document.getElementById("save").addEventListener("click", async () => {
  setStatus("Saving…", false);
  try {
    const res = await fetch("/hotkeys-config", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify({ bindings }),
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);
    // deployed:false isn't a fetch/network failure (the save itself succeeded, res.ok is true)
    // but it does mean the server's own installer.sh reload-hotkeys attempt failed — worth the
    // status line's error styling so a deploy problem doesn't read as identical to full success.
    setStatus(`Saved ${result.bindingCount} hotkey(s). ${result.note || ""}`, result.deployed === false);
  } catch (e) {
    setStatus("Save failed: " + e.message, true);
  }
});

// Ctrl+S saves instead of opening the browser's "Save Page As" dialog — works from anywhere on
// the page (document-level, not tied to one field's focus) except while the key-sequence
// recorder (recordKeyField) has focus, where Ctrl+S needs to mean "record Ctrl+S as this
// binding's key" instead; that field's own keydown handler already handles it, so this just gets
// out of the way rather than double-handling the same keypress.
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "s") return;
  if (document.activeElement && document.activeElement.readOnly) return;
  e.preventDefault();
  document.getElementById("save").click();
});

async function load() {
  try {
    const [profilesResult, configResult] = await Promise.all([
      apiGet("/profiles"),
      apiGet("/hotkeys-config"),
    ]);
    profiles = profilesResult;
    bindings = configResult.bindings || [];
    renderAll();
    setStatus(`Loaded ${bindings.length} hotkey(s), ${profiles.length} known profile(s).`, false);
  } catch (e) {
    setStatus("Load failed (check your token, and that the server is running): " + e.message, true);
    return;
  }
  // Separate, best-effort fetch: main.js only pushes this every 10s (see its own comment), so a
  // very-first load right after install could still race an empty list — that's fine, it just
  // means the typeahead has nothing to suggest until the next push, not a reason to fail the
  // whole page load the way a missing token/hotkeys.json genuinely should above. No re-render
  // needed here (unlike profiles/bindings above) — showSuggestionsFor reads this array live,
  // on demand, whenever a resourceClass field is actually focused.
  try {
    runningResourceClasses = await apiGet("/running-resource-classes");
  } catch (e) {
    runningResourceClasses = [];
  }
}

// The token field starts empty on a fresh page load (nothing to prefill from server-side
// state), so the very first load() below always runs with no token and fails — that's
// expected, not a bug. What pastes the token in also has to be what triggers the retry:
// "change" (fires on blur/Enter) covers paste-then-click-away, and the Reload button covers
// paste-then-click-Reload. Neither call is "load once at page load and hope" like before.
const tokenInput = document.getElementById("token");
actualToken = (localStorage.getItem("atsToken") || "").trim();
tokenInput.value = maskToken(actualToken);
tokenInput.addEventListener("focus", () => { tokenInput.value = actualToken; });
tokenInput.addEventListener("blur", () => { tokenInput.value = maskToken(actualToken); });
tokenInput.addEventListener("input", (e) => {
  actualToken = e.target.value.trim();
  localStorage.setItem("atsToken", actualToken);
});
tokenInput.addEventListener("change", load);
document.getElementById("reload").addEventListener("click", load);

load();
</script>
</body>
</html>
